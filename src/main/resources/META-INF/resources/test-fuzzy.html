<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Test - Fuzzy Search</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
        }
        .test-section h2 {
            margin-top: 0;
            color: #374151;
            font-size: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            margin-left: 10px;
        }
        .status-loading {
            background: #fef3c7;
            color: #92400e;
        }
        .status-success {
            background: #d1fae5;
            color: #065f46;
        }
        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }
        .test-case {
            padding: 15px;
            margin: 10px 0;
            background: white;
            border-left: 4px solid #ddd;
            border-radius: 4px;
        }
        .test-case.pass {
            border-left-color: #10b981;
        }
        .test-case.fail {
            border-left-color: #ef4444;
        }
        .test-query {
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 5px;
        }
        .test-results {
            color: #6b7280;
            font-size: 14px;
            margin: 5px 0;
        }
        .test-expected {
            color: #9ca3af;
            font-size: 13px;
            font-style: italic;
        }
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            text-align: center;
        }
        .summary h3 {
            margin-top: 0;
            font-size: 24px;
        }
        .summary-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            display: block;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Fuzzy Search Integration Test</h1>
        <p class="subtitle">Testing fuzzy search functionality with real module imports</p>
        
        <div class="test-section">
            <h2>
                Module Loading Status
                <span id="load-status" class="status-badge status-loading">
                    <span class="loading-spinner"></span> Loading...
                </span>
            </h2>
            <div id="load-details" style="margin-top: 10px; color: #6b7280;"></div>
        </div>
        
        <div class="test-section">
            <h2>Test Cases</h2>
            <div id="test-cases"></div>
        </div>
        
        <div id="summary" class="summary" style="display: none;">
            <h3>Test Summary</h3>
            <div class="summary-stats">
                <div class="stat">
                    <span class="stat-number" id="total-tests">0</span>
                    <span class="stat-label">Total Tests</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="passed-tests">0</span>
                    <span class="stat-label">Passed</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="failed-tests">0</span>
                    <span class="stat-label">Failed</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="success-rate">0%</span>
                    <span class="stat-label">Success Rate</span>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        // Test configuration
        const testFiles = [
            { name: 'hello.txt', type: 'file' },
            { name: 'world.md', type: 'file' },
            { name: 'document.pdf', type: 'file' },
            { name: 'README.md', type: 'file' },
            { name: 'package.json', type: 'file' },
            { name: 'index.html', type: 'file' },
            { name: 'style.css', type: 'file' },
            { name: 'script.js', type: 'file' },
            { name: 'configuration.yaml', type: 'file' },
            { name: 'hello_world.py', type: 'file' }
        ];
        
        const testCases = [
            { query: 'helo', expected: ['hello.txt', 'hello_world.py'], description: 'Typo in "hello"' },
            { query: 'wrld', expected: ['world.md', 'hello_world.py'], description: 'Missing vowels in "world"' },
            { query: 'indx', expected: ['index.html'], description: 'Typo in "index"' },
            { query: 'styl', expected: ['style.css'], description: 'Partial match "style"' },
            { query: 'conf', expected: ['configuration.yaml'], description: 'Prefix match "conf"' },
            { query: 'readme', expected: ['README.md'], description: 'Case-insensitive match' },
            { query: 'hello', expected: ['hello.txt', 'hello_world.py'], description: 'Exact match "hello"' },
            { query: 'doc', expected: ['document.pdf'], description: 'Prefix match "doc"' }
        ];
        
        // Update load details
        function updateLoadDetails(message) {
            document.getElementById('load-details').textContent = message;
        }
        
        // Run tests
        async function runTests() {
            try {
                updateLoadDetails('Importing fuzzy search module...');
                
                // Import the fuzzy search module
                const module = await import('/js/fuzzySearch.js');
                const fuzzySearch = module.default;
                
                updateLoadDetails('Waiting for Fuse.js to initialize...');
                
                // Wait for Fuse.js to load
                let attempts = 0;
                const maxAttempts = 100;
                
                await new Promise((resolve, reject) => {
                    const checkReady = setInterval(() => {
                        attempts++;
                        if (fuzzySearch.ready) {
                            clearInterval(checkReady);
                            resolve();
                        } else if (attempts >= maxAttempts) {
                            clearInterval(checkReady);
                            reject(new Error('Timeout waiting for Fuse.js to load'));
                        }
                    }, 50);
                });
                
                updateLoadDetails('✓ Module loaded successfully');
                document.getElementById('load-status').textContent = '✓ Ready';
                document.getElementById('load-status').className = 'status-badge status-success';
                
                // Index test files
                fuzzySearch.setItems(testFiles);
                
                // Run test cases
                const testCasesDiv = document.getElementById('test-cases');
                let passed = 0;
                let failed = 0;
                
                for (const test of testCases) {
                    const startTime = performance.now();
                    const results = fuzzySearch.search(test.query);
                    const endTime = performance.now();
                    const searchTime = (endTime - startTime).toFixed(2);
                    
                    const foundNames = results.map(r => r.name);
                    const hasMatch = test.expected.some(expected => foundNames.includes(expected));
                    
                    const testDiv = document.createElement('div');
                    testDiv.className = `test-case ${hasMatch ? 'pass' : 'fail'}`;
                    
                    const status = hasMatch ? '✅ PASS' : '❌ FAIL';
                    testDiv.innerHTML = `
                        <div class="test-query">${status} - ${test.description}</div>
                        <div class="test-results">Query: "${test.query}" → Found: ${foundNames.length > 0 ? foundNames.join(', ') : 'No matches'}</div>
                        <div class="test-expected">Expected: ${test.expected.join(' or ')} | Search time: ${searchTime}ms</div>
                    `;
                    
                    testCasesDiv.appendChild(testDiv);
                    
                    if (hasMatch) {
                        passed++;
                    } else {
                        failed++;
                    }
                }
                
                // Show summary
                const total = testCases.length;
                const successRate = ((passed / total) * 100).toFixed(1);
                
                document.getElementById('total-tests').textContent = total;
                document.getElementById('passed-tests').textContent = passed;
                document.getElementById('failed-tests').textContent = failed;
                document.getElementById('success-rate').textContent = successRate + '%';
                document.getElementById('summary').style.display = 'block';
                
                console.log('✓ All tests completed successfully');
                
            } catch (error) {
                console.error('Test failed:', error);
                document.getElementById('load-status').textContent = '✗ Error';
                document.getElementById('load-status').className = 'status-badge status-error';
                updateLoadDetails('Error: ' + error.message);
            }
        }
        
        // Start tests when page loads
        runTests();
    </script>
</body>
</html>
