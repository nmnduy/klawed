<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileSurf - Login</title>
    <!-- Force light mode only -->
    <script>
        (function() {
            try {
                // Remove dark class if it exists
                document.documentElement.classList.remove('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{cssPath}">
    {#if authenticated is true}
    <meta http-equiv="refresh" content="0; url={redirectUrl}">
    {/if}
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">
    {#if authenticated is true}
    <div class="text-center">
        <p class="text-body-m text-muted-foreground">Redirecting...</p>
    </div>
    {#else}
    <div class="w-full max-w-md">
        <div class="login-card bg-card/95 backdrop-blur-xl rounded-2xl p-6 sm:p-8 md:p-10 border border-border/60 shadow-xl">
            <!-- Icon -->
            <div class="flex justify-center mb-6">
                <div class="login-icon float-animation w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center bg-[linear-gradient(135deg,_color-mix(in_srgb,_hsl(var(--primary))_90%,_hsl(var(--accent))_10%),_color-mix(in_srgb,_hsl(var(--primary))_70%,_hsl(var(--accent))_30%))] shadow-[0_10px_40px_-10px_color-mix(in_srgb,_hsl(var(--primary))_50%,_transparent)]">
                    <svg class="w-8 h-8 sm:w-10 sm:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" />
                    </svg>
                </div>
            </div>

            <!-- Header -->
            <div class="text-center mb-8 space-y-2">
                <h1 class="text-h2-headline-l text-foreground">Welcome to FileSurf</h1>
                <p class="text-body-m text-muted-foreground">Enter your email to continue</p>
            </div>

            <!-- Form -->
            <form action="/auth/login" method="POST" id="login-form" data-role="login-form" class="space-y-6">
                {#if redirect}
                <input type="hidden" name="redirect" value="{redirect}" />
                {#else}
                <input type="hidden" name="redirect" value="/app" />
                {/if}

                <div class="space-y-2">
                    <label for="email" class="block text-body-s-bold text-foreground">
                        Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autofocus
                        placeholder="you@example.com"
                        class="w-full px-4 py-3 sm:py-3.5 rounded-xl border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition-all duration-200"
                    />
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full py-3 sm:py-3.5 px-4 bg-[linear-gradient(135deg,_color-mix(in_srgb,_hsl(var(--primary))_90%,_hsl(var(--accent))_10%),_color-mix(in_srgb,_hsl(var(--primary))_70%,_hsl(var(--accent))_30%))] hover:bg-[linear-gradient(135deg,_color-mix(in_srgb,_hsl(var(--primary))_95%,_hsl(var(--accent))_5%),_color-mix(in_srgb,_hsl(var(--primary))_75%,_hsl(var(--accent))_25%))] text-white font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 focus:ring-offset-background shadow-[0_4px_14px_0_color-mix(in_srgb,_hsl(var(--primary))_40%,_transparent)] hover:shadow-[0_6px_20px_0_color-mix(in_srgb,_hsl(var(--primary))_50%,_transparent)] hover:translate-y-[-1px] active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span id="btn-text">Continue with Email</span>
                    <span id="btn-spinner" class="hidden">
                        <svg class="inline-block animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Signing in...
                    </span>
                </button>
            </form>

            <!-- Waitlist link -->
            <div class="mt-6 text-center">
                <p class="text-caption-m text-muted-foreground">
                    No invite? <a href="/waitlist" class="text-orange-600 hover:text-orange-700 underline transition-colors">Join the waitlist</a>
                </p>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="hidden mt-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-600 text-body-s text-center"></div>

            <!-- Footer -->
            <div class="mt-8 pt-6 border-t border-border/60">
                <p class="text-center text-caption-m text-muted-foreground">
                    <span class="inline-flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        Invite-only access
                    </span>
                </p>
            </div>
        </div>

        <!-- Branding & Links -->
        <div class="text-center mt-6 space-y-2">
            <p class="text-caption-s text-muted-foreground">
                FileSurf &copy; 2026
            </p>
            <p class="text-caption-s">
                <a href="/privacy" class="text-muted-foreground hover:text-foreground transition-colors underline">
                    Privacy Policy
                </a>
            </p>
        </div>
    </div>

    <script type="module" src="{inject:jsHelper.path('loginWaitlist')}"></script>
    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        form.addEventListener('submit', function(e) {
            const email = document.getElementById('email').value.trim();
            const errorDiv = document.getElementById('error-message');

            if (!email) {
                e.preventDefault();
                errorDiv.textContent = 'Please enter your email address';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                e.preventDefault();
                errorDiv.textContent = 'Please enter a valid email address';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Hide error and show spinner
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
        });
    </script>
    {/if}
</body>
</html>
