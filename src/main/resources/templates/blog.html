<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{pageTitle}</title>
    {#include partials/head.html /}
    <!-- Apply saved or system theme early to prevent flash -->
    <script>
        (() => {
            const STORAGE_KEY = 'filesurf-theme';
            const DARK_CLASS = 'dark';
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light';
                if (theme === 'dark') {
                    document.documentElement.classList.add(DARK_CLASS);
                } else {
                    document.documentElement.classList.remove(DARK_CLASS);
                }
            } catch (error) {
                // Fallback to system preference if storage is unavailable
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add(DARK_CLASS);
                }
            }
        })();
    </script>
    <link rel="stylesheet" href="{cssPath}">
    <script type="module" src="{inject:jsHelper.path('darkMode')}"></script>
    <script defer src="{inject:jsHelper.path('blog')}"></script>
</head>
<body class="bg-background min-h-screen">
    <!-- Header -->
    {#include partials/blogHeader.html /}

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Main Content -->
            <div class="lg:col-span-3 space-y-8">
                <!-- Loading indicator -->
                <div id="loading-indicator" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
                    <p class="mt-4 text-body-m text-muted-foreground">Loading posts...</p>
                </div>
                
                <!-- Content will be rendered here by blog.js -->
                <div id="main-content" style="display: none;"></div>
            </div>

            <!-- Sidebar -->
            <aside class="space-y-6">
                <!-- Search -->
                <div class="bg-card/80 backdrop-blur rounded-xl border border-border/60 p-6 shadow-sm">
                    <h3 class="text-h5-headline-xs font-bold text-semantic-info mb-4">Search</h3>
                    <form action="/blog/search" method="GET" class="space-y-0">
                        <div class="flex gap-2">
                            <input 
                                type="text" 
                                name="q" 
                                placeholder="Search posts..." 
                                class="flex-1 px-3 py-2 rounded-lg border border-border bg-background text-foreground text-body-s focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" 
                                required
                            />
                            <button 
                                type="submit" 
                                class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors flex items-center justify-center"
                                aria-label="Search"
                            >
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Categories -->
                <div id="categories-widget" class="bg-card/80 backdrop-blur rounded-xl border border-border/60 p-6">
                    <h3 class="text-h5-headline-xs font-bold text-semantic-info mb-4">Categories</h3>
                    <ul id="categories-list" class="space-y-2">
                        <!-- Categories will be rendered here by blog.js -->
                    </ul>
                </div>

                <!-- Popular Posts -->
                <div id="popular-posts-widget" class="bg-card/80 backdrop-blur rounded-xl border border-border/60 p-6">
                    <h3 class="text-h5-headline-xs font-bold text-semantic-info mb-4">Popular Posts</h3>
                    <ul id="popular-posts-list" class="space-y-3">
                        <!-- Popular posts will be rendered here by blog.js -->
                    </ul>
                </div>

                <!-- Tags -->
                <div id="tags-widget" class="bg-card/80 backdrop-blur rounded-xl border border-border/60 p-6">
                    <h3 class="text-h5-headline-xs font-bold text-semantic-info mb-4">Tags</h3>
                    <div id="tags-list" class="flex flex-wrap gap-2">
                        <!-- Tags will be rendered here by blog.js -->
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-border/60 bg-card/80 backdrop-blur mt-12">
        <div class="max-w-6xl mx-auto px-4 py-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <p class="text-caption-m text-muted-foreground">
                    © 2026 FileSurf Blog. All rights reserved.
                </p>
                <div class="flex items-center gap-4">
                    <a href="/rss.xml" class="text-caption-m text-muted-foreground hover:text-semantic-link-hover transition-colors">RSS Feed</a>
                    <a href="/atom.xml" class="text-caption-m text-muted-foreground hover:text-semantic-link-hover transition-colors">Atom Feed</a>
                    <a href="/sitemap.xml" class="text-caption-m text-muted-foreground hover:text-semantic-link-hover transition-colors">Sitemap</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
