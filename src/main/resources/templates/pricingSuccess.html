<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - FileSurf</title>
    <link rel="stylesheet" href="/css/{cssPath}">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 text-center">
            <!-- Success Icon -->
            <div class="w-20 h-20 bg-green-100 dark:bg-green-900 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">
                Payment Successful!
            </h1>
            
            <p class="text-gray-600 dark:text-gray-400 mb-8">
                Thank you for subscribing to FileSurf. Your payment has been processed successfully and your account has been upgraded.
            </p>

            <div class="bg-blue-50 dark:bg-blue-900/30 rounded-lg p-4 mb-8">
                <p class="text-sm text-blue-800 dark:text-blue-300">
                    <strong>Session ID:</strong> {sessionId}
                </p>
                <p class="text-sm text-blue-800 dark:text-blue-300 mt-2">
                    A confirmation email has been sent to your registered email address.
                </p>
            </div>

            <div class="space-y-3">
                <a href="/file-chat" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition">
                    Go to Dashboard
                </a>
                <a href="/" class="block w-full bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white font-semibold py-3 px-6 rounded-lg transition">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
