<!-- Template Browser Panel -->
<div id="template-browser-panel" class="w-full h-full bg-layout-main-container overflow-hidden flex flex-col">
    <!-- Template Browser Header -->
    <div class="px-4 py-3 border-b border-layout-border">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-semantic-link-unvisited" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <div>
                <h3 class="text-h5-headline-xs font-semibold text-layout-content-high">Templates</h3>
                <p class="text-caption-s text-layout-content-low">Tap a template to preview</p>
            </div>
        </div>
    </div>

    <!-- Template Content Area -->
    <div class="flex-1 overflow-hidden flex">
        <!-- List column -->
        <div class="flex-1 overflow-hidden">
            <!-- Loading State -->
            <div id="template-browser-loading" class="h-full flex items-center justify-center">
                <div class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-semantic-link-unvisited mb-3"></div>
                    <p class="text-caption-m text-layout-content-low">Loading templates...</p>
                </div>
            </div>

            <!-- Empty State -->
            <div id="template-browser-empty" class="hidden h-full flex items-center justify-center">
                <div class="text-center max-w-sm">
                    <svg class="w-12 h-12 text-layout-border mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <h4 class="text-h6-headline-xs font-semibold text-layout-content-medium mb-1">No templates found</h4>
                    <p class="text-caption-m text-layout-content-low">Create your first template in chat</p>
                </div>
            </div>

            <!-- Template List -->
            <div id="template-browser-list" class="hidden h-full overflow-y-auto">
                <ul class="divide-y divide-layout-border">
                    <!-- Template list items will be dynamically inserted here -->
                </ul>
            </div>
        </div>

        <!-- Template Preview Sidebar (desktop) -->
        <div id="template-preview-sidebar" class="hidden lg:flex flex-col w-[360px] border-l border-layout-border bg-layout-main-container">
            <div class="px-4 py-3 border-b border-layout-border flex items-center justify-between">
                <h3 class="text-h5-headline-xs font-semibold text-layout-content-high">Preview</h3>
                <button id="template-preview-sidebar-close" class="p-2 hover:bg-layout-surface rounded-lg transition-colors">
                    <svg class="w-5 h-5 text-layout-content-low" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="flex-1 overflow-hidden p-4">
                <div id="template-preview-sidebar-content" class="h-full overflow-y-auto">
                    <!-- Preview content will be dynamically inserted here -->
                </div>
            </div>
            <div class="px-4 py-3 border-t border-layout-border text-caption-s text-layout-content-low">
                Select a template to preview its contents.
            </div>
        </div>
    </div>
</div>

<!-- Template Preview Modal (mobile) -->
<div id="template-preview-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-layout-main-container rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col">
        <div class="px-4 py-3 border-b border-layout-border flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span id="template-preview-name" class="text-h5-headline-xs font-semibold text-layout-content-high"></span>
            </div>
            <button id="template-preview-close" class="p-2 hover:bg-layout-surface rounded-lg transition-colors">
                <svg class="w-5 h-5 text-layout-content-low" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="flex-1 overflow-hidden p-4">
            <div id="template-preview-content" class="h-full overflow-y-auto">
                <!-- Preview content will be dynamically inserted here -->
            </div>
        </div>
    </div>
</div>

<script type="module" src="/js/templateBrowser.js"></script>
