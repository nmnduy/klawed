<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - FileSurf</title>
    <link rel="stylesheet" href="/css/{cssPath}">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 text-center">
            <!-- Warning Icon -->
            <div class="w-20 h-20 bg-yellow-100 dark:bg-yellow-900 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-yellow-600 dark:text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">
                Payment Cancelled
            </h1>
            
            <p class="text-gray-600 dark:text-gray-400 mb-8">
                Your payment has been cancelled. No charges were made to your account.
            </p>

            <div class="bg-blue-50 dark:bg-blue-900/30 rounded-lg p-4 mb-8">
                <p class="text-sm text-blue-800 dark:text-blue-300">
                    If you experienced any issues during checkout, please contact our support team.
                </p>
            </div>

            <div class="space-y-3">
                <a href="/#pricing" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition">
                    View Pricing Again
                </a>
                <a href="/" class="block w-full bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white font-semibold py-3 px-6 rounded-lg transition">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
