<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the FileSurf Waitlist</title>
    {#include partials/head.html /}
    <link rel="stylesheet" href="{cssPath}">
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">
    <div class="w-full max-w-lg">
        <div class="bg-card/95 backdrop-blur-xl rounded-2xl p-6 sm:p-8 md:p-10 border border-border/60 shadow-xl space-y-8">
            <!-- Header -->
            <div class="text-center space-y-2">
                <p class="text-caption-m text-primary font-semibold">Waitlist</p>
                <h1 class="text-h2-headline-l text-foreground">Join the FileSurf waitlist</h1>
                <p class="text-body-m text-muted-foreground">Tell us how to reach you and how you plan to use FileSurf.</p>
            </div>

            <!-- Waitlist form -->
            <form class="space-y-4" data-role="waitlist-form" novalidate>
                <div class="space-y-2">
                    <label class="block text-body-s-bold text-foreground" for="waitlist-email">Email (required)</label>
                    <input
                        id="waitlist-email"
                        type="email"
                        name="waitlist-email"
                        placeholder="you@example.com"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200"
                        data-role="waitlist-email"
                    />
                </div>
                <div class="space-y-2">
                    <label class="block text-body-s-bold text-foreground" for="waitlist-name">Name (optional)</label>
                    <input
                        id="waitlist-name"
                        type="text"
                        name="waitlist-name"
                        placeholder="Your name"
                        class="w-full px-4 py-3 rounded-xl border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200"
                        data-role="waitlist-name"
                    />
                </div>
                <div class="space-y-2">
                    <label class="block text-body-s-bold text-foreground" for="waitlist-usecase">How would you use FileSurf? (optional)</label>
                    <textarea
                        id="waitlist-usecase"
                        name="waitlist-usecase"
                        rows="3"
                        placeholder="Tell us briefly about your use case"
                        class="w-full px-4 py-3 rounded-xl border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200"
                        data-role="waitlist-usecase"
                    ></textarea>
                </div>
                <div class="space-y-3">
                    <div class="hidden p-3 rounded-xl bg-destructive/10 border border-destructive/20 text-destructive text-body-s" data-role="waitlist-error"></div>
                    <div class="hidden p-3 rounded-xl bg-semantic-success/10 border border-semantic-success/20 text-semantic-success text-body-s" data-role="waitlist-success"></div>
                    <button
                        type="submit"
                        class="w-full py-3 px-4 bg-[linear-gradient(135deg,_color-mix(in_srgb,_hsl(var(--primary))_90%,_hsl(var(--accent))_10%),_color-mix(in_srgb,_hsl(var(--primary))_70%,_hsl(var(--accent))_30%))] hover:bg-[linear-gradient(135deg,_color-mix(in_srgb,_hsl(var(--primary))_95%,_hsl(var(--accent))_5%),_color-mix(in_srgb,_hsl(var(--primary))_75%,_hsl(var(--accent))_25%))] text-white font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background shadow-[0_4px_14px_0_color-mix(in_srgb,_hsl(var(--primary))_40%,_transparent)] hover:shadow-[0_6px_20px_0_color-mix(in_srgb,_hsl(var(--primary))_50%,_transparent)] hover:translate-y-[-1px] active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed"
                        data-role="waitlist-submit"
                    >
                        <span data-role="btn-text">Join waitlist</span>
                        <span data-role="btn-spinner" class="hidden">
                            <svg class="inline-block animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Submitting...
                        </span>
                    </button>
                </div>
            </form>

            <div class="text-center text-caption-m text-muted-foreground space-y-2">
                <p>Invite-only access right now. We’ll email you when your spot is ready.</p>
                <a class="text-primary font-semibold hover:text-primary/80 transition-colors" href="/auth/login">Back to login</a>
            </div>
        </div>
    </div>

    <script type="module" src="{inject:jsHelper.path('loginWaitlist')}"></script>
</body>
</html>
