<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileSurf - AI Assistant</title>
    {#include partials/head.html /}
    <!-- Apply saved or system theme early to prevent flash -->
    <script>
        (() => {
            const STORAGE_KEY = 'filesurf-theme';
            const DARK_CLASS = 'dark';
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light';
                if (theme === 'dark') {
                    document.documentElement.classList.add(DARK_CLASS);
                } else {
                    document.documentElement.classList.remove(DARK_CLASS);
                }
            } catch (error) {
                // Fallback to system preference if storage is unavailable
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add(DARK_CLASS);
                }
            }
        })();
    </script>
    <link rel="stylesheet" href="{cssPath}">
    <!--
      Inline styles for scrollbar customization.
      Required because Tailwind doesn't support ::-webkit-scrollbar pseudo-elements.
      Colors use CSS variables for theme consistency.
    -->
    <style>
        #chat-container::-webkit-scrollbar {
            width: 10px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, color-mix(in srgb, hsl(var(--primary)) 80%, hsl(var(--muted)) 20%), color-mix(in srgb, hsl(var(--accent)) 80%, hsl(var(--muted)) 20%));
            border-radius: 9999px;
            border: 2px solid color-mix(in srgb, hsl(var(--background)) 92%, transparent);
            box-shadow: 0 6px 16px color-mix(in srgb, hsl(var(--primary)) 14%, transparent);
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, color-mix(in srgb, hsl(var(--primary)) 82%, hsl(var(--muted)) 18%), color-mix(in srgb, hsl(var(--accent)) 82%, hsl(var(--muted)) 18%));
        }
        #chat-container::-webkit-scrollbar-corner {
            background: transparent;
        }
    </style>
    <script src="{inject:jsHelper.path('uploadProgress')}" defer></script>
    <script src="{inject:jsHelper.path('standardUpload')}" defer></script>
    <script src="{inject:jsHelper.path('chunkedUpload')}" defer></script>
    <script src="{inject:jsHelper.path('dbViewer')}" defer></script>
    <script src="{inject:jsHelper.path('feedback')}" defer></script>
    <script src="{inject:jsHelper.path('filePanelResize')}" defer></script>
    <script src="/js/vendor/lucide.min.js" defer></script>
    <script type="module" src="{inject:jsHelper.path('darkMode')}"></script>
    <script type="module" src="{inject:jsHelper.path('fileExplorer')}"></script>
    <script type="module" src="{inject:jsHelper.path('fileChat')}"></script>
</head>
<body class="bg-background min-h-screen overflow-hidden">
    <div class="flex flex-col h-screen" data-chat-root>
        <!-- Header with gradient and status merged -->
        {#include partials/chatHeader.html /}

        <!-- Mobile connection status pill (shown only when not connected) -->
        <div id="mobile-status-pill" data-mobile-status-pill class="hidden sm:hidden fixed top-16 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 px-4 py-2 rounded-full border-2 bg-background/95 text-foreground shadow-lg backdrop-blur-sm animate-fade-in">
            <div class="relative flex items-center justify-center">
                <div data-mobile-status-pulse class="status-pulse status-pulse--working"></div>
                <div data-mobile-status-indicator class="status-indicator status-indicator--working"></div>
            </div>
            <span data-mobile-status-text class="text-caption-m font-medium whitespace-nowrap">Connecting…</span>
        </div>

        <!-- Tabs moved inline with header on mobile, separate tabs no longer needed -->
        <!-- The chatTabs.html partial is kept for potential future use but hidden -->

        <!-- Main Content Area with Chat and File Explorer -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Chat Panel -->
            <div id="chat-panel" class="relative flex-1 flex flex-col overflow-hidden lg:border-r-2 lg:border-border transition-all duration-300" role="tabpanel" aria-labelledby="chat-tab">
                <!-- Floating AI Working Indicator -->
                <div id="ai-working-indicator" data-ai-working-indicator class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 px-4 py-2 rounded-full border-2 border-primary/60 bg-background/95 text-foreground shadow-md backdrop-blur-sm animate-fade-in">
                    <span class="flex gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-primary animate-[chat-typing_1.15s_ease-in-out_infinite_0s]"></span>
                        <span class="w-1.5 h-1.5 rounded-full bg-primary animate-[chat-typing_1.15s_ease-in-out_infinite_0.12s]"></span>
                        <span class="w-1.5 h-1.5 rounded-full bg-primary animate-[chat-typing_1.15s_ease-in-out_infinite_0.24s]"></span>
                    </span>
                    <span class="text-body-s font-medium text-muted-foreground">AI is thinking...</span>
                </div>

                <!-- Chat Messages Area with improved scrolling -->
                <div id="chat-container" data-chat-container class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-5 bg-[hsl(var(--background))] [scrollbar-width:thin] [scrollbar-color:color-mix(in_srgb,_hsl(var(--primary))_55%,_hsl(var(--muted))_45%)_transparent]" style="
                    --scrollbar-thumb-bg: linear-gradient(180deg, color-mix(in srgb, hsl(var(--primary)) 80%, hsl(var(--muted)) 20%), color-mix(in srgb, hsl(var(--accent)) 80%, hsl(var(--muted)) 20%));
                    --scrollbar-thumb-border: color-mix(in srgb, hsl(var(--background)) 92%, transparent);
                    --scrollbar-thumb-shadow: 0 6px 16px color-mix(in srgb, hsl(var(--primary)) 14%, transparent);
                " aria-live="polite">
                    <!-- Welcome message with modern card -->
                    {#include partials/chatEmptyState.html /}
                </div>

                <!-- Input Area with modern styling -->
                {#include partials/chatInputBar.html /}
            </div>

            <!-- Resize Handle (Desktop only) -->
            <div id="resize-handle" class="hidden lg:block relative w-1 bg-border hover:bg-primary/50 cursor-col-resize transition-colors duration-200 group" data-resize-handle>
                <div class="absolute inset-y-0 -left-1 -right-1"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-1 h-12 bg-primary/30 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
            </div>

            <!-- File Panel -->
            <div id="file-panel" class="hidden lg:flex flex-col overflow-hidden transition-all duration-300" style="width: 400px; min-width: 250px; max-width: 800px;" role="tabpanel" aria-labelledby="file-tab" data-file-panel>
                <!-- Collapse Button -->
                <button id="file-panel-collapse" class="absolute top-2 -left-3 z-10 w-6 h-6 bg-card border-2 border-border rounded-full flex items-center justify-center hover:bg-muted hover:border-primary transition-all duration-200 shadow-md" title="Collapse file explorer" data-collapse-button>
                    <svg class="w-3 h-3 text-muted-foreground transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" data-collapse-icon>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
                
                <!-- File Explorer Panel (included from separate template) -->
                {#include fileExplorer.html /}
            </div>

        </div>
    </div>

    <!-- Feedback Modal -->
    {#include partials/feedbackModal.html /}
</div>

</body>
</html>
