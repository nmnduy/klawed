<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileSurf - AI Assistant</title>
    <!-- Force light mode only -->
    <script>
        (function() {
            try {
                // Remove dark class if it exists
                document.documentElement.classList.remove('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{cssPath}">
    <!-- 
      Inline styles for scrollbar customization.
      Required because Tailwind doesn't support ::-webkit-scrollbar pseudo-elements.
      Colors use CSS variables for theme consistency.
    -->
    <style>
        #chat-container::-webkit-scrollbar {
            width: 10px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, color-mix(in srgb, hsl(var(--primary)) 80%, hsl(var(--muted)) 20%), color-mix(in srgb, hsl(var(--accent)) 80%, hsl(var(--muted)) 20%));
            border-radius: 9999px;
            border: 2px solid color-mix(in srgb, hsl(var(--background)) 92%, transparent);
            box-shadow: 0 6px 16px color-mix(in srgb, hsl(var(--primary)) 14%, transparent);
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, color-mix(in srgb, hsl(var(--primary)) 82%, hsl(var(--muted)) 18%), color-mix(in srgb, hsl(var(--accent)) 82%, hsl(var(--muted)) 18%));
        }
        #chat-container::-webkit-scrollbar-corner {
            background: transparent;
        }
    </style>
    <script src="{inject:jsHelper.path('chunkedUpload')}" defer></script>
    <script src="{inject:jsHelper.path('fileExplorer')}" defer></script>
    <script type="module" src="{inject:jsHelper.path('fileChat')}"></script>
</head>
<body class="bg-background min-h-screen overflow-hidden">
    <div class="flex flex-col h-screen" data-chat-root>
        <!-- Header with gradient and status merged -->
        {#include partials/chatHeader.html /}

        <!-- Tabs for Chat and Files (shown only on mobile/tablet) -->
        <div class="lg:hidden">
            {#include partials/chatTabs.html /}
        </div>

        <!-- Main Content Area with Chat and File Explorer -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Chat Panel -->
            <div id="chat-panel" class="flex-1 flex flex-col overflow-hidden lg:border-r-2 lg:border-slate-200 dark:lg:border-slate-700" role="tabpanel" aria-labelledby="chat-tab">
                <!-- Chat Messages Area with improved scrolling -->
                <div id="chat-container" data-chat-container class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-5 bg-[hsl(var(--background))] [scrollbar-width:thin] [scrollbar-color:color-mix(in_srgb,_hsl(var(--primary))_55%,_hsl(var(--muted))_45%)_transparent]" style="
                    --scrollbar-thumb-bg: linear-gradient(180deg, color-mix(in srgb, hsl(var(--primary)) 80%, hsl(var(--muted)) 20%), color-mix(in srgb, hsl(var(--accent)) 80%, hsl(var(--muted)) 20%));
                    --scrollbar-thumb-border: color-mix(in srgb, hsl(var(--background)) 92%, transparent);
                    --scrollbar-thumb-shadow: 0 6px 16px color-mix(in srgb, hsl(var(--primary)) 14%, transparent);
                " aria-live="polite">
                    <!-- Welcome message with modern card -->
                    {#include partials/chatEmptyState.html /}
                </div>

                <!-- Input Area with modern styling -->
                {#include partials/chatInputBar.html /}
            </div>

            <!-- File Panel -->
            <div id="file-panel" class="hidden lg:flex flex-col overflow-hidden" role="tabpanel" aria-labelledby="file-tab">
                <!-- File Explorer Panel (included from separate template) -->
                {#include fileExplorer.html /}
            </div>


        </div>
    </div>
</div>

</body>
</html>
