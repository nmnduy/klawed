<header class="border-b border-border/60 bg-card/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 text-h4-headline-s font-bold text-semantic-info">
            <img src="/assets/filesurf-logo.svg" alt="FileSurf" class="w-8 h-8" />
            <span>FileSurf Blog</span>
        </a>
        <nav class="flex items-center gap-4">
            <a href="/blog" class="hidden md:block text-body-m font-medium text-foreground hover:text-semantic-link-hover transition-colors">Home</a>
            <a href="/blog/search" class="hidden md:block text-body-m font-medium text-muted-foreground hover:text-semantic-link-hover transition-colors">Search</a>
            <a href="/rss.xml" class="hidden md:block text-body-m font-medium text-muted-foreground hover:text-semantic-link-hover transition-colors" title="RSS Feed">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6.503 20.752c0 1.794-1.456 3.248-3.251 3.248-1.796 0-3.252-1.454-3.252-3.248 0-1.794 1.456-3.248 3.252-3.248 1.795.001 3.251 1.454 3.251 3.248zm-6.503-12.572v4.811c6.05.062 10.96 4.966 11.022 11.009h4.817c-.062-8.71-7.118-15.758-15.839-15.82zm0-3.368c10.58.046 19.152 8.594 19.183 19.188h4.817c-.03-13.231-10.755-23.954-24-24v4.812z"/>
                </svg>
            </a>
            <button
                type="button"
                data-theme-toggle
                class="relative inline-flex items-center justify-center w-9 h-9 rounded-lg border border-transparent bg-muted/60 text-muted-foreground hover:bg-muted hover:text-foreground transition-colors shrink-0"
                aria-label="Toggle dark mode"
                title="Toggle theme"
            >
                <!-- Moon icon (shown in light mode) -->
                <svg class="w-4 h-4 moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <!-- Sun icon (shown in dark mode) -->
                <svg class="w-4 h-4 sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </button>
        </nav>
    </div>
</header>
