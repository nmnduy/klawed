<div class="relative sticky top-0 z-20 px-3 sm:px-6 py-2.5 sm:py-4 shadow-sm border-b-2 border-border backdrop-blur-xl bg-gradient-to-r from-card/95 to-muted/95" data-chat-header>
    <div class="max-w-screen-2xl mx-auto">
        <div class="flex flex-col gap-2 sm:gap-3">
            <!-- Top row: Logo, tagline, tabs (mobile) and actions -->
            <div class="flex items-center justify-between gap-2">
                <!-- Left: Logo, Tagline, Tabs (mobile) -->
                <div class="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
                    <!-- Logo and brand -->
                    <div class="flex items-center gap-2 shrink-0">
                        <img src="/assets/filesurf-logo.svg" alt="FileSurf logo" class="h-7 w-7 sm:h-8 sm:w-8 select-none" loading="lazy">
                        <span class="text-h3-headline-m sm:text-h2-headline-l font-bold tracking-tight bg-gradient-to-r from-foreground to-foreground/70 bg-clip-text text-transparent">FileSurf</span>
                        <span class="hidden sm:inline-flex items-center justify-center rounded-full text-caption-m-bold px-2.5 py-[2px] bg-gradient-to-br from-primary to-primary/90 text-white shadow-lg shadow-primary/30 border border-primary/80">AI</span>
                    </div>
                    
                    <!-- Inline tabs (mobile only) -->
                    <nav class="flex items-center gap-1 lg:hidden ml-2" role="tablist" aria-label="Chat and file tabs" data-chat-tabs-inline>
                        <button
                            id="chat-tab-inline"
                            data-tab="chat"
                            class="tab-button-inline tab-button-inline--active flex items-center justify-center gap-1.5 px-2.5 py-1.5 rounded-lg text-caption-m font-medium transition-all duration-200"
                            role="tab"
                            aria-selected="true"
                            aria-controls="chat-panel"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                            </svg>
                            <span class="hidden xs:inline">Chat</span>
                        </button>
                        <button
                            id="file-tab-inline"
                            data-tab="file"
                            class="tab-button-inline flex items-center justify-center gap-1.5 px-2.5 py-1.5 rounded-lg text-caption-m font-medium transition-all duration-200"
                            role="tab"
                            aria-selected="false"
                            aria-controls="file-panel"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                            </svg>
                            <span class="hidden xs:inline">Files</span>
                        </button>
                    </nav>
                </div>

                <!-- Right: Connection Status and Menu -->
                <div class="flex items-center gap-2 shrink-0">
                    <!-- Connection Status - Color only on mobile, text on desktop -->
                    <div class="hidden sm:inline-flex items-center gap-2" role="status" aria-live="polite">
                        <div class="relative flex items-center justify-center">
                            <div id="status-pulse" data-status-pulse class="status-pulse status-pulse--working"></div>
                            <div id="status-indicator" data-status-indicator class="status-indicator status-indicator--working"></div>
                        </div>
                        <span id="status-text" data-status-text class="status-text status-text--working whitespace-nowrap">Connecting…</span>
                    </div>
                    
                    <!-- Desktop: Individual buttons -->
                    <div class="hidden sm:flex items-center gap-2">
                        <a href="/privacy" target="_blank" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border border-transparent bg-muted/60 text-muted-foreground hover:bg-muted hover:text-foreground transition-colors shrink-0" title="Privacy Policy">
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <span class="text-caption-m whitespace-nowrap">Privacy</span>
                        </a>
                        <button
                            type="button"
                            id="feedback-button"
                            data-feedback-button
                            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border border-transparent bg-muted/60 text-muted-foreground hover:bg-muted hover:text-foreground transition-colors shrink-0"
                            aria-label="Send feedback"
                            title="Send feedback"
                        >
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                            </svg>
                            <span class="text-caption-m whitespace-nowrap">Feedback</span>
                        </button>
                        <button
                            type="button"
                            id="theme-toggle"
                            data-theme-toggle
                            class="inline-flex items-center justify-center px-3 py-1.5 rounded-lg border border-transparent bg-muted/60 text-muted-foreground hover:bg-muted hover:text-foreground transition-colors shrink-0"
                            aria-label="Toggle dark mode"
                            title="Toggle theme"
                        >
                            <!-- Moon icon (shown in light mode) -->
                            <svg class="w-4 h-4 moon-icon shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                            <!-- Sun icon (shown in dark mode) -->
                            <svg class="w-4 h-4 sun-icon shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        </button>
                    </div>

                    <!-- Mobile: Three-dot menu -->
                    <div class="relative sm:hidden">
                        <button
                            type="button"
                            id="mobile-menu-button"
                            data-mobile-menu-button
                            class="inline-flex items-center justify-center p-2 rounded-lg border border-transparent bg-muted/60 text-muted-foreground hover:bg-muted hover:text-foreground transition-colors"
                            aria-label="Open menu"
                            aria-expanded="false"
                            aria-haspopup="true"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                            </svg>
                        </button>
                        <!-- Dropdown menu -->
                        <div
                            id="mobile-menu"
                            data-mobile-menu
                            class="hidden absolute right-0 top-full mt-2 w-48 rounded-lg shadow-lg bg-card border-2 border-border backdrop-blur-xl overflow-hidden z-50"
                            role="menu"
                            aria-orientation="vertical"
                            aria-labelledby="mobile-menu-button"
                        >
                            <a href="/privacy" target="_blank" class="flex items-center gap-3 px-4 py-3 text-body-s text-foreground hover:bg-muted transition-colors" role="menuitem">
                                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                                <span>Privacy Policy</span>
                            </a>
                            <button
                                type="button"
                                id="feedback-button-mobile"
                                data-feedback-button
                                class="w-full flex items-center gap-3 px-4 py-3 text-body-s text-foreground hover:bg-muted transition-colors"
                                role="menuitem"
                            >
                                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                                </svg>
                                <span>Send Feedback</span>
                            </button>
                            <button
                                type="button"
                                id="theme-toggle-mobile"
                                data-theme-toggle
                                class="w-full flex items-center gap-3 px-4 py-3 text-body-s text-foreground hover:bg-muted transition-colors"
                                role="menuitem"
                            >
                                <svg class="w-4 h-4 moon-icon shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                                </svg>
                                <svg class="w-4 h-4 sun-icon shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                                </svg>
                                <span>Toggle Theme</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Second row: Tagline (desktop only) -->
            <div class="hidden sm:flex items-center gap-2 text-sm text-muted-foreground">
                <svg class="w-4 h-4 text-primary drop-shadow-sm shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
                <span class="text-caption-m">AI-powered computer, in the ☁️</span>
            </div>
        </div>
    </div>
</div>
