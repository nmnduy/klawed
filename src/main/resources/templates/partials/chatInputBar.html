<div class="px-3 sm:px-4 py-4 border-t-2 border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 backdrop-blur-lg shadow-lg" data-chat-input>
    <form id="message-form" data-message-form class="flex gap-2 max-w-4xl mx-auto">
        <div class="flex-1 relative">
            <textarea 
                id="message-input" 
                data-message-input
                placeholder="Ask me anything about your files..." 
                class="flex h-12 w-full rounded-lg border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 px-4 py-2 pr-12 text-body-m transition-all duration-300 shadow-sm ring-offset-background file:border-0 file:bg-transparent file:text-body-s-bold file:font-medium placeholder:text-slate-400 dark:placeholder:text-slate-500 focus-visible:outline-none focus-visible:border-orange-500 dark:focus-visible:border-orange-400 focus-visible:ring-2 focus-visible:ring-orange-200 dark:focus-visible:ring-orange-900/50 hover:border-slate-400 dark:hover:border-slate-500 disabled:cursor-not-allowed disabled:opacity-50 disabled:bg-slate-100 dark:disabled:bg-slate-800 resize-none"
                disabled
                aria-label="Message input"
                rows="1"
            ></textarea>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
                <!-- Upload Button -->
                <button 
                    type="button"
                    id="chat-upload-button"
                    data-chat-upload-button
                    class="inline-flex items-center justify-center rounded-lg border-2 border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 hover:border-slate-400 dark:hover:border-slate-500 hover:scale-[1.02] active:scale-[0.98] h-8 w-8 disabled:pointer-events-none disabled:opacity-50 disabled:hover:scale-100 transition-all duration-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 dark:focus-visible:ring-orange-400 focus-visible:ring-offset-2 shadow-sm hover:shadow-md active:shadow-sm"
                    disabled
                    aria-label="Upload files"
                    title="Upload files"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                </button>
                
                <!-- Send Button -->
                <button 
                    type="submit" 
                    id="send-button"
                    data-send-button
                    class="inline-flex items-center justify-center rounded-lg bg-gradient-to-br from-orange-500 to-orange-600 text-white hover:from-orange-600 hover:to-orange-700 hover:scale-[1.02] active:scale-[0.98] h-8 w-8 disabled:pointer-events-none disabled:opacity-50 disabled:hover:scale-100 transition-all duration-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 shadow-sm hover:shadow-md active:shadow-sm"
                    disabled
                    aria-label="Send message"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>
        <!-- Hidden file input for chat upload -->
        <input 
            type="file" 
            id="chat-file-input"
            data-chat-file-input
            class="hidden" 
            accept=".pdf,.png,.jpg,.jpeg,.txt,.csv,.xml"
            multiple
        />
    </form>
    <div class="text-center mt-2">
        <p class="text-caption-s text-slate-500 dark:text-slate-400 hidden sm:block">Press Enter to send • Shift+Enter for new line • Click upload button or switch to Files tab</p>
        <p class="text-caption-s text-slate-500 dark:text-slate-400 sm:hidden">Press Enter to send • Shift+Enter for new line • Click upload button</p>
    </div>
</div>
