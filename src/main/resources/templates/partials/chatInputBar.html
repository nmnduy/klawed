<div class="px-3 sm:px-4 py-3 border-t-2 border-slate-100 bg-card backdrop-blur-lg shadow-lg" data-chat-input>
    <form id="message-form" data-message-form class="flex gap-2 max-w-4xl mx-auto">
        <div class="flex-1 relative">
            <textarea 
                id="message-input" 
                data-message-input
                placeholder="Ask me anything about your files..." 
                class="flex h-12 w-full rounded-lg border-2 border-slate-200 bg-white px-4 py-2 pr-12 text-body-m transition-all duration-300 shadow-sm ring-offset-background file:border-0 file:bg-transparent file:text-body-s-bold file:font-medium placeholder:text-slate-400 dark:placeholder:text-slate-500 focus-visible:outline-none focus-visible:border-orange-500 focus-visible:ring-2 focus-visible:ring-orange-100 hover:border-slate-300 disabled:cursor-not-allowed disabled:opacity-50 disabled:bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white dark:focus-visible:border-orange-400 dark:focus-visible:ring-orange-500/20 resize-none"
                disabled
                aria-label="Message input"
                rows="1"
            ></textarea>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
                <button 
                    type="submit" 
                    id="send-button"
                    data-send-button
                    class="inline-flex items-center justify-center rounded-lg bg-gradient-to-br from-orange-500 to-orange-600 text-white hover:from-orange-600 hover:to-orange-700 hover:scale-[1.02] active:scale-[0.98] h-8 w-8 disabled:pointer-events-none disabled:opacity-50 disabled:hover:scale-100 transition-all duration-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 shadow-sm hover:shadow-md active:shadow-sm"
                    disabled
                    aria-label="Send message"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>
    </form>
    <div class="text-center mt-2">
        <p class="text-caption-s text-slate-500 hidden sm:block">Press Enter to send • Shift+Enter for new line • Switch to Files tab to upload</p>
        <p class="text-caption-s text-slate-500 sm:hidden">Press Enter to send • Shift+Enter for new line</p>
    </div>
</div>
