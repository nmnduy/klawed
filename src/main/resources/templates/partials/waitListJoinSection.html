<!-- Waitlist Join Section -->
<section id="pricing" class="py-16 px-4 sm:px-6 lg:px-8 bg-layout-surface">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-12">
            <p class="text-body-s text-layout-content-medium uppercase tracking-wide">Coming Soon</p>
            <h2 class="text-display-s text-layout-emphasis-high mt-3 mb-4">Join the Waitlist</h2>
            <p class="text-body-l text-layout-content-medium">Be the first to know when we launch our pricing plans. We're finalizing our model rate limits and will notify you as soon as we're ready.</p>
        </div>

        <div class="max-w-2xl mx-auto">
            <div class="rounded-2xl border-2 border-border bg-card p-8 shadow-lg">
                <form id="waitlist-form" class="space-y-6">
                    <div>
                        <label for="waitlist-email" class="block text-body-m font-medium text-layout-emphasis-high mb-2">
                            Email Address <span class="text-semantic-error">*</span>
                        </label>
                        <input 
                            type="email" 
                            id="waitlist-email" 
                            name="email" 
                            required
                            class="w-full px-4 py-3 text-body-m bg-background border-2 border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                            placeholder="you@example.com"
                        />
                    </div>

                    <div>
                        <label for="waitlist-name" class="block text-body-m font-medium text-layout-emphasis-high mb-2">
                            Name (Optional)
                        </label>
                        <input 
                            type="text" 
                            id="waitlist-name" 
                            name="name" 
                            class="w-full px-4 py-3 text-body-m bg-background border-2 border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                            placeholder="Your name"
                        />
                    </div>

                    <div>
                        <label for="waitlist-usecase" class="block text-body-m font-medium text-layout-emphasis-high mb-2">
                            What will you use FileSurf for? (Optional)
                        </label>
                        <textarea 
                            id="waitlist-usecase" 
                            name="useCase" 
                            rows="3"
                            class="w-full px-4 py-3 text-body-m bg-background border-2 border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all resize-none"
                            placeholder="Tell us about your use case..."
                        ></textarea>
                    </div>

                    <div id="waitlist-message" class="hidden p-4 rounded-lg"></div>

                    <button 
                        type="submit" 
                        id="waitlist-submit"
                        class="w-full px-6 py-3 text-body-l font-semibold text-primary-foreground bg-primary rounded-lg hover:bg-primary/90 shadow-md hover:shadow-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Join Waitlist
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t-2 border-border">
                    <p class="text-body-s text-layout-content-medium text-center">
                        We respect your privacy. Your email will only be used to notify you about FileSurf updates.
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
