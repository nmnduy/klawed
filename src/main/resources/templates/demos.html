<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileSurf - Demo Videos</title>
    <!-- Force light mode only -->
    <script>
        (function() {
            try {
                document.documentElement.classList.remove('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{cssPath}">
    <style>
        /* Video player custom styling */
        video::-webkit-media-controls-panel {
            background: linear-gradient(to top, hsl(var(--muted) / 0.9) 0%, transparent 100%);
        }
        /* Smooth card hover effect */
        .demo-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .demo-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-background min-h-screen">
    <!-- Header -->
    <div class="border-b border-border bg-gradient-to-r from-white to-primary/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <a href="/app" class="p-2 hover:bg-muted rounded-lg transition-colors duration-200" title="Back to FileSurf">
                        <svg class="w-5 h-5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </a>
                    <div class="flex items-center gap-2">
                        <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <div>
                            <h1 class="text-h3-headline-m font-semibold text-foreground">Demo Videos</h1>
                            <p class="text-caption-s text-muted-foreground hidden sm:block">Learn how to use FileSurf</p>
                        </div>
                    </div>
                </div>
                <div id="demo-stats" class="text-caption-s text-muted-foreground">
                    Loading...
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Loading State -->
        <div id="demos-loading" class="flex items-center justify-center py-16">
            <div class="text-center">
                <div class="inline-flex items-center gap-2 px-4 py-2 bg-muted rounded-lg">
                    <svg class="w-5 h-5 animate-spin text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="text-body-s text-muted-foreground">Loading demos...</span>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="demos-empty" class="hidden flex items-center justify-center py-16">
            <div class="text-center space-y-4">
                <svg class="w-16 h-16 text-muted-foreground/50 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <p class="text-body-m text-muted-foreground">No demo videos available yet</p>
                <p class="text-caption-s text-muted-foreground">Check back later for tutorials and guides</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="demos-error" class="hidden flex items-center justify-center py-16">
            <div class="text-center space-y-4">
                <svg class="w-16 h-16 text-destructive/60 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p id="demos-error-message" class="text-body-m text-destructive">Failed to load demos</p>
                <button id="demos-retry" class="inline-flex items-center gap-2 px-4 py-2 bg-destructive/10 hover:bg-destructive/20 text-destructive rounded-lg text-body-s font-medium transition-all duration-200 border border-destructive/20 hover:border-destructive/30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Retry
                </button>
            </div>
        </div>

        <!-- Demo Grid -->
        <div id="demos-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Demo cards will be inserted here -->
        </div>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-2 sm:p-4" role="dialog" aria-modal="true">
        <div class="bg-card rounded-xl shadow-2xl w-full max-w-7xl max-h-[95vh] flex flex-col overflow-hidden border border-border">
            <!-- Modal Header -->
            <div class="px-3 sm:px-4 py-2.5 border-b border-border bg-muted/50 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                    <svg class="w-5 h-5 text-primary flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h3 id="video-modal-title" class="text-h5-headline-xs font-semibold text-foreground truncate">Demo Video</h3>
                </div>
                <button id="video-modal-close" class="p-2 hover:bg-muted rounded-lg transition-colors duration-200" title="Close">
                    <svg class="w-5 h-5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- Video Container -->
            <div class="flex-1 bg-black flex items-center justify-center">
                <video id="video-player" class="w-full h-full max-h-[calc(95vh-3rem)]" controls preload="metadata">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <script src="{inject:jsHelper.path('demos')}" defer></script>
</body>
</html>
