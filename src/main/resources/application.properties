# Quarkus configuration
# Use port 9090 for main application (was 8080)
# Port 9090 is blocked by firewall except for Tailscale network
quarkus.http.port=9090
quarkus.http.host=0.0.0.0
# Always enable HTTP
quarkus.http.insecure-requests=enabled

# HTTP body size limits (for file uploads)
# Max body size for HTTP requests (110 MB to accommodate 100 MB files + form overhead)
quarkus.http.limits.max-body-size=110M
# Max form attribute size (for multipart form data)
quarkus.http.limits.max-form-attribute-size=110M

# Application configuration
quarkus.application.name=filesurf
quarkus.application.version=1.0.0-SNAPSHOT

klawed.path=/home/fandalf/.local/bin/klawed
# OpenAI-compatible Agent configuration
# Agent binary path (klawed)
openai.proxy.http=
openai.proxy.https=
# OpenAI-compatible API configuration
openai.api.base=https://api.deepseek.com
openai.api.model=deepseek-chat

# Logging configuration
# Console logging (keep for development)
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# File logging configuration
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# File rotation configuration
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true

# Root logger level
quarkus.log.level=INFO

# Set specific loggers to different levels if needed
quarkus.log.category."com.filesurf.service".level=DEBUG

# Klawed agent logging
# All klawed agents (one per session) write to the same log file
# Log messages include session IDs for filtering
quarkus.log.handler.file.KLAWED_AGENTS.enable=true
quarkus.log.handler.file.KLAWED_AGENTS.path=logs/klawed-agents.log
quarkus.log.handler.file.KLAWED_AGENTS.level=INFO
quarkus.log.handler.file.KLAWED_AGENTS.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %s%e%n

# Klawed agents file rotation
quarkus.log.handler.file.KLAWED_AGENTS.rotation.max-file-size=50M
quarkus.log.handler.file.KLAWED_AGENTS.rotation.max-backup-index=10
quarkus.log.handler.file.KLAWED_AGENTS.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.handler.file.KLAWED_AGENTS.rotation.rotate-on-boot=true

# Session-aware logging for klawed service classes
quarkus.log.category."com.filesurf.service.KlawedAgentManager".level=INFO
quarkus.log.category."com.filesurf.websocket.FileChatWebSocket".level=INFO

# HTTP logging filter configuration
quarkus.log.category."com.filesurf.filter.HttpLoggingFilter".level=INFO

# Database configuration - SQLite (Quarkiverse extension)
# Using SQLiteManager singleton instead of connection pooling
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/filesurf.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000&foreign_keys=ON

# Disable Hibernate - using direct JDBC via SQLiteManager

# Disable Hibernate ORM features we're not using
quarkus.hibernate-orm.enabled=false

# Disable Flyway since we'll manage schema manually
quarkus.flyway.enabled=false

# Persistent storage configuration
filesurf.persist.root=${PERSIST_ROOT:./data/persistent}
filesurf.sessions.base-dir=${SESSION_BASE_DIR:/tmp/fs-sessions}

# Demo videos configuration
# Directory where demo MP4 videos are stored
# Development: data/demos (local), Production: /var/lib/filesurf/demos
demo.videos.directory=${DEMO_VIDEOS_DIR:./data/demos}

# Cookie configuration
# Set to true in production when using HTTPS
cookie.secure=false

# Metrics and Monitoring Configuration
# Enable Micrometer metrics
quarkus.micrometer.enabled=true
# Enable Prometheus registry
quarkus.micrometer.export.prometheus.enabled=true
# Expose Prometheus metrics endpoint
quarkus.micrometer.export.prometheus.path=/metrics
# Enable JVM metrics
quarkus.micrometer.binder.jvm.enabled=true
# Enable system metrics
quarkus.micrometer.binder.system.enabled=true
# Enable HTTP metrics
quarkus.micrometer.binder.http-server.enabled=true
# Enable metrics for all endpoints (not just annotated ones)
quarkus.micrometer.binder.http-server.requests-metric-name=http.server.requests
# Enable application metrics
quarkus.micrometer.binder.mp-metrics.enabled=true

# NOTE: Metrics are exposed on the main HTTP port (9090) at /metrics
# Access is restricted by firewall rules - only Tailscale network (100.x.x.x) can access port 9090
# Public access via Cloudflare Tunnel is configured to ignore /metrics endpoint

# =============================================================================
# Klawed Communication Configuration
# =============================================================================
# Communication mode: SQLite queue only
# Uses SQLite database for message passing between client and klawed agent

# SQLite queue configuration
# Directory for klawed message database files
# Each session creates its own database file (klawed_messages_{sessionId}.db) in this directory
# Using a separate temp directory keeps workspace clean and allows easy cleanup
klawed.sqlite-queue.db-dir=${KLAWED_MESSAGES_DIR:./data/klawed-messages}

# SQLite queue sender/receiver names (for message routing)
klawed.sqlite-queue.sender-name=client
klawed.sqlite-queue.receiver-name=klawed

# Chat messages database configuration
# Directory for per-session chat message database files
# Each session creates its own database file (chat_messages_{sessionId}.db) in this directory
chat.messages.db-dir=${CHAT_MESSAGES_DIR:./data/chat-messages}

# Session tracking database
# Stores active sessions and their connection status
klawed.sessions.db.path=data/sessions.db

# Feedback database
# Stores user feedback in a separate database
feedback.db.path=data/feedback.db

# Scheduled cleanup of old klawed DB files
# Runs daily at 3 AM to remove files older than 60 days (2 months)
# Uses: find <dir> -name "klawed_messages_*.db*" -mtime +60 -delete
klawed.db-cleanup.enabled=true

# Scheduled cleanup of old chat message DB files
# Runs daily at 3 AM to remove files older than 60 days (2 months)
# Uses: find <dir> -name "chat_messages_*.db*" -mtime +60 -delete
chat.db-cleanup.enabled=true

# =============================================================================
# Podman Sandbox Configuration
# =============================================================================
# Enable Podman sandboxing for klawed agents
# Set to true to run klawed in containers (production mode)
# Set to false to disable container support
sandbox.podman.enabled=${SANDBOX_PODMAN_ENABLED:true}

# Path to environment file for klawed containers
# This file contains environment variables (API keys, AWS credentials, etc.) that will be
# passed to klawed containers. Using a file prevents leftover environment variables from
# the JVM process from affecting klawed execution.
# Default: /etc/filesurf/klawed.env (production)
# For development, you can create a local .env file in the project root
sandbox.podman.env-file=${KLAWED_ENV_FILE:/etc/filesurf/klawed.env}

# Container image to use for sandboxed agents
# IMPORTANT: Never use 'latest' tag. Always specify a version tag for reproducibility.
# Example: klawed-sandbox:1.0.0
sandbox.podman.image=${KLAWED_SANDBOX_IMAGE:klawed-sandbox:0.16.2}

# Resource limits
sandbox.podman.memory=2g
sandbox.podman.cpus=2
sandbox.podman.pids-limit=512

# Timeout for container operations (seconds)
sandbox.podman.timeout=30

# Path to podman binary (leave empty to use PATH)
sandbox.podman.binary-path=

# =============================================================================
# Container Tracking Database
# =============================================================================
# Path to the SQLite database for tracking container state
# This is separate from the main filesurf.db to keep container tracking isolated
container.tracking.db.path=${CONTAINER_TRACKING_DB_PATH:data/containers.db}

# How long to keep container tracking records (in days)
# Records older than this will be automatically deleted on startup
container.tracking.retention.days=14

# =============================================================================
# Container Liveness Monitoring
# =============================================================================
# Enable/disable container liveness monitoring (checks if klawed containers are alive)
container.liveness.enabled=true

# Interval between liveness checks (supports Quarkus duration format: 10s, 1m, etc.)
container.liveness.check.interval=10s

# Automatically restart containers that die unexpectedly
container.liveness.auto-restart=true

# Maximum number of restart attempts before giving up
container.liveness.max-restart-attempts=3

# Cooldown period between restart attempts (in seconds)
container.liveness.restart-cooldown-seconds=30

# =============================================================================
# Production Profile Overrides
# =============================================================================
# All production-specific overrides use %prod. prefix to avoid needing a separate
# application-prod.properties file. This keeps all configuration in one place.

# Agent configuration - production paths
%prod.klawed.path=/usr/local/bin/klawed

# Logging configuration - production paths and levels
%prod.quarkus.log.file.path=/var/log/filesurf/application.log
%prod.quarkus.log.file.level=INFO
%prod.quarkus.log.handler.file.KLAWED_AGENTS.path=/var/log/filesurf/klawed-agents.log

# Remove debug logging in production
%prod.quarkus.log.category."com.filesurf.service".level=INFO

# Database configuration - production path
%prod.quarkus.datasource.jdbc.url=jdbc:sqlite:/var/lib/filesurf/data/filesurf.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000&foreign_keys=ON

# Persistent storage configuration - production paths
%prod.filesurf.persist.root=/var/lib/filesurf/persistent
%prod.filesurf.sessions.base-dir=/var/lib/filesurf/sessions

# Demo videos configuration - production path
%prod.demo.videos.directory=/var/lib/filesurf/demos

# Enable secure cookies in production (requires HTTPS)
%prod.cookie.secure=true

# Enable Podman sandbox in production
%prod.sandbox.podman.enabled=true

# Production container tracking database path
%prod.container.tracking.db.path=/var/lib/filesurf/data/containers.db

# Production feedback database path
%prod.feedback.db.path=/var/lib/filesurf/data/feedback.db

# Production klawed messages directory (temp directory for DB files)
%prod.klawed.sqlite-queue.db-dir=/var/lib/filesurf/data/klawed-messages

# Production chat messages directory
%prod.chat.messages.db-dir=/var/lib/filesurf/data/chat-messages

# Production sessions database path
%prod.klawed.sessions.db.path=/var/lib/filesurf/data/sessions.db
