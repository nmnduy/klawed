# Production configuration for FileSurf v2
# This file overrides application.properties when -Dquarkus.profile=prod is used

# HTTP Configuration - Use port 9090 to match existing deployment
quarkus.http.port=9090
quarkus.http.host=0.0.0.0

# Application configuration
quarkus.application.name=filesurf
quarkus.application.version=1.0.0-SNAPSHOT

# Agent configuration - production paths
klawed.path=/usr/local/bin/klawed
openai.proxy.http=
openai.proxy.https=
openai.api.base=https://api.deepseek.com
openai.api.model=deepseek-chat

# Logging configuration - Production logging
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# File logging configuration
quarkus.log.file.enable=true
quarkus.log.file.path=/var/log/filesurf/application.log
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# File rotation configuration
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true

# Root logger level
quarkus.log.level=INFO

# Klawed agent logging
quarkus.log.handler.file.KLAWED_AGENTS.enable=true
quarkus.log.handler.file.KLAWED_AGENTS.path=/var/log/filesurf/klawed-agents.log
quarkus.log.handler.file.KLAWED_AGENTS.level=INFO
quarkus.log.handler.file.KLAWED_AGENTS.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %s%e%n
quarkus.log.handler.file.KLAWED_AGENTS.rotation.max-file-size=50M
quarkus.log.handler.file.KLAWED_AGENTS.rotation.max-backup-index=10
quarkus.log.handler.file.KLAWED_AGENTS.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.handler.file.KLAWED_AGENTS.rotation.rotate-on-boot=true

# Database configuration - Production SQLite (Quarkiverse extension)
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:/var/lib/filesurf/data/filesurf.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000&foreign_keys=ON

# Disable Hibernate ORM
quarkus.hibernate-orm.enabled=false
quarkus.flyway.enabled=false

# Persistent storage configuration - Production paths
filesurf.persist.root=/var/lib/filesurf/persistent
filesurf.sessions.base-dir=/var/lib/filesurf/sessions

# Demo videos configuration - Production path
demo.videos.directory=/var/lib/filesurf/demos

# Cookie configuration - Enable secure cookies for production
cookie.secure=true

# Metrics and Monitoring Configuration
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.system.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-server.requests-metric-name=http.server.requests
quarkus.micrometer.binder.mp-metrics.enabled=true

# Memory optimization settings for native image
# These are compile-time settings and should also be set as build arguments
quarkus.native.resources.includes=templates/**,css/**,META-INF/**
quarkus.native.additional-build-args=--initialize-at-run-time=io.netty.handler.ssl.ReferenceCountedOpenSslEngine,\
  -H:+ReportExceptionStackTraces

# Performance tuning for production
quarkus.vertx.event-loops-pool-size=4
quarkus.thread-pool.max-threads=16
