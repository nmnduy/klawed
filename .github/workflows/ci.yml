name: CI (GitHub)

on:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libcurl4-openssl-dev \
            libcjson-dev \
            libbsd-dev \
            libsqlite3-dev \
            libncursesw5-dev \
            libssl-dev

      - name: Build
        run: make

      - name: Run tests
        timeout-minutes: 10
        run: |
          make \
            test-arena \
            test-array-resize \
            test-base64 \
            test-config \
            test-config-merge \
            test-redact \
            test-wrap \
            test-edit \
            test-http-client \
            test-json-parsing \
            test-markdown-render \
            test-line-printer \
            test-code-block-fill \
            test-dump-utils \
            test-todo \
            test-todo-write \
            test-model-capabilities \
            test-paste \
            test-paste-placeholder \
            test-memory-null-fix \
            test-rotation \
            test-message-queue \
            test-bash-timeout \
            test-bash-stderr \
            test-bash-truncation \
            test-cancel-flow \
            test-tool-results-regression \
            test-history-file \
            test-tui-input-buffer \
            test-tui-auto-scroll \
            test-tool-details \
            test-token-usage \
            test-token-usage-comprehensive \
            test-token-usage-session-totals \
            test-token-usage-db-metadata \
            test-sqlite-queue-seeding \
            test-file-search \
            test-provider-init-from-config \
            test-provider-init \
            test-session-resolve \
            test-codex-tools \
            test-tool-disable
